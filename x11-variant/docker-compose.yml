services:
  server:
    build: ./server
    image: x11-fwd-server:dev
    container_name: x11-fwd-server
    hostname: server
    networks: [x11net]
    volumes:
      - keys:/srv/keys
    environment:
      COOKIE_LENGTH: "1"
      MAX_ROUNDS: "8"
      MIN_MARGIN: "1"
      MIN_AGREEMENT: "1"
      SETTLE_S: "0.20"

  client:
    build: ./client
    image: x11-fwd-client:dev
    container_name: x11-fwd-client
    hostname: client
    networks: [x11net]
    volumes:
      - keys:/srv/keys
    depends_on:
      - server

networks:
  x11net:
    driver: bridge

volumes:
  keys:
