<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Internal Cat Gallery</title>
  <style>
    body { font-family: sans-serif; max-width: 800px; margin: 2em auto; background: #f5f5f5; }
    h1 { color: #333; }
    .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1em; }
    .gallery img { width: 100%; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,.15); }
    .card { background: #fff; padding: .5em; border-radius: 8px; text-align: center; }
    .card p { margin: .5em 0 0; color: #666; font-size: .9em; }
  </style>
</head>
<body>
  <h1>Internal Cat Gallery</h1>
  <p>Welcome to the company intranet's finest collection of cat pictures.</p>
  <div class="gallery">
    <div class="card">
      <img src="/images/cat1.svg" alt="Orange tabby">
      <p>Mr. Whiskers</p>
    </div>
    <div class="card">
      <img src="/images/cat2.svg" alt="Black cat">
      <p>Shadow</p>
    </div>
    <div class="card">
      <img src="/images/cat3.svg" alt="Calico cat">
      <p>Patches</p>
    </div>
    <div class="card">
      <img src="/images/cat4.svg" alt="Siamese cat">
      <p>Luna</p>
    </div>
  </div>
</body>
</html>
