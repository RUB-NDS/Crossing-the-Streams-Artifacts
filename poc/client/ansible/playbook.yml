---
# become: true makes Ansible write the sudo password to ssh's stdin,
# producing the SSH_MSG_CHANNEL_DATA packet the attack measures.
# sleep 2 keeps the SSH tunnel alive for the attacker's measurement;
# any task that holds the connection open long enough works equally.
- name: Ansible SSH Compression Vulnerability PoC
  hosts: ansible-target
  gather_facts: false
  become: true
  become_method: sudo
  tasks:
    - name: hold tunnel open
      ansible.builtin.raw: sleep 2
