[defaults]
inventory = /app/ansible/inventory.yml
host_key_checking = True
stdout_callback = minimal
retry_files_enabled = False

[ssh_connection]
# -C is Ansible's default; it enables SSH compression (the side-channel
# this PoC exploits).  ControlMaster=no is a PoC simplification -- the
# attack also works with multiplexing enabled but takes longer due to
# additional noise and/or delay.
ssh_args = -C -o ControlMaster=no -o ControlPersist=no
pipelining = False
