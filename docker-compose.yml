name: ssh-compression-poc

services:
  # ----------------------------------------------------------------------
  # Generates SSH host key + client user key on a shared volume.
  # Other services depend on this completing successfully.
  # ----------------------------------------------------------------------
  keygen:
    build:                   # reuse server image (has ssh-keygen)
      context: .
      dockerfile: server/Dockerfile
    container_name: poc-keygen
    volumes:
      - ./keys:/keys
      - ./scripts:/scripts:ro
    command: ["/bin/sh", "/scripts/keygen.sh"]
    networks:
      - sshpoc

  # ----------------------------------------------------------------------
  # Internal Redis server.  The victim's application authenticates to it
  # with AUTH <password> through the SSH tunnel.  Started WITHOUT a
  # password -- the client sets one via CONFIG SET after the tunnel is up.
  # ----------------------------------------------------------------------
  redis:
    image: redis:8-alpine
    container_name: poc-redis
    hostname: redis
    networks:
      - sshpoc

  # ----------------------------------------------------------------------
  # Internal nginx web server serving cat pictures.  The victim tunnels
  # it on 0.0.0.0:8080 so other devices on the LAN can reach it --
  # which is the attack surface the attacker exploits.
  # ----------------------------------------------------------------------
  webhost:
    image: nginx:alpine
    container_name: poc-webhost
    hostname: webhost
    volumes:
      - ./webhost/html:/usr/share/nginx/html:ro
    networks:
      - sshpoc

  # ----------------------------------------------------------------------
  # SSH server (the bastion / jump host).  Forces compression, allows
  # TCP/IP port forwarding to redis and webhost on the internal network.
  # ----------------------------------------------------------------------
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: poc-server
    hostname: server
    depends_on:
      keygen:
        condition: service_completed_successfully
      redis:
        condition: service_started
      webhost:
        condition: service_started
    volumes:
      - ./keys:/keys:ro
    networks:
      - sshpoc

  # ----------------------------------------------------------------------
  # Attacker: passive MitM at the TCP layer + scapy packet observer +
  # attack orchestrator.  Sits on the path between client and server.
  # ----------------------------------------------------------------------
  attacker:
    build: ./attacker
    container_name: poc-attacker
    hostname: attacker
    depends_on:
      - server
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      - PYTHONUNBUFFERED=1
      - SERVER_HOST=server
      - SERVER_PORT=22
      - LISTEN_PORT=2222
      - HTTP_PORT=9000
      - CLIENT_CONTROL_URL=http://client:8000
      - CLIENT_HOST=client
      - WEB_TUNNEL_PORT=8080
    ports:
      - "9000:9000"
    networks:
      - sshpoc

  # ----------------------------------------------------------------------
  # Client (the victim host).  Connects via the attacker's TCP forwarder,
  # sets up two local port forwards (Redis + web), and exposes a small
  # HTTP control API used by the test harness.
  # ----------------------------------------------------------------------
  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: poc-client
    hostname: client
    depends_on:
      keygen:
        condition: service_completed_successfully
      attacker:
        condition: service_started
      redis:
        condition: service_started
      webhost:
        condition: service_started
    volumes:
      - ./keys:/keys:ro
    environment:
      - PYTHONUNBUFFERED=1
      - SSH_TARGET_HOST=attacker
      - SSH_TARGET_PORT=2222
      - SSH_REAL_SERVER=server
      - SSH_USERNAME=victim
      - HTTP_PORT=8000
      - WEB_TUNNEL_DEST_HOST=webhost
      - WEB_TUNNEL_DEST_PORT=80
      - REDIS_TUNNEL_DEST_HOST=redis
      - REDIS_TUNNEL_DEST_PORT=6379
      - SECRET_VALUE=hunter2
    ports:
      - "8000:8000"
    networks:
      - sshpoc

networks:
  sshpoc:
    driver: bridge
