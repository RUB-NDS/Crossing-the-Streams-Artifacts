name: ssh-compression-poc

services:
  # Generates SSH host key + client user key on a shared volume.
  keygen:
    build:                   # reuse server image (has ssh-keygen)
      context: .
      dockerfile: server/Dockerfile
    container_name: poc-keygen
    volumes:
      - ./keys:/keys
      - ./scripts:/scripts:ro
    # Bypass the server image's pin-hosts ENTRYPOINT: keygen runs first in
    # the dependency order, so siblings don't exist yet and pinning would
    # burn ~30s per peer waiting for them.
    entrypoint: []
    command: ["/bin/sh", "/scripts/keygen.sh"]
    networks:
      - sshpoc

  # The victim's application authenticates to this Redis with AUTH <password>
  # through the SSH tunnel. Started without a password -- the client sets one
  # via CONFIG SET after the tunnel is up.
  redis:
    image: redis:8-alpine
    container_name: poc-redis
    hostname: redis
    networks:
      - sshpoc

  # SSH server. Forces compression, allows TCP/IP port forwarding to redis
  # on the internal network.
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: poc-server
    hostname: server
    depends_on:
      keygen:
        condition: service_completed_successfully
      redis:
        condition: service_started
    volumes:
      - ./keys:/keys:ro
    networks:
      - sshpoc

  # Attacker: passive on-path observer at the TCP layer + scapy packet
  # observer + attack orchestrator. Sits on the path between client and
  # server but never decrypts or modifies SSH traffic.
  attacker:
    build:
      context: .
      dockerfile: attacker/Dockerfile
    container_name: poc-attacker
    hostname: attacker
    depends_on:
      - server
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      - PYTHONUNBUFFERED=1
      - SERVER_HOST=server
      - SERVER_PORT=22
      - LISTEN_PORT=2222
      - HTTP_PORT=9000
      - CLIENT_CONTROL_URL=http://client:8000
      - CLIENT_HOST=client
      # Local forward ports on the client that the attacker dials into.
      # TUNNEL_PORT is the Redis tunnel used by the direct/browser scenarios;
      # ANSIBLE_TUNNEL_PORT is the LocalForward declared in the client's
      # /root/.ssh/config and used by the Ansible scenario.
      - TUNNEL_PORT=6379
      - ANSIBLE_TUNNEL_PORT=15432
    ports:
      - "9000:9000"
    networks:
      - sshpoc

  # Client (the victim host). Connects via the attacker's TCP forwarder,
  # sets up local port forwards, and exposes a small HTTP control API used
  # by the test harness.
  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: poc-client
    hostname: client
    depends_on:
      keygen:
        condition: service_completed_successfully
      attacker:
        condition: service_started
      redis:
        condition: service_started
    volumes:
      - ./keys:/keys:ro
    environment:
      - PYTHONUNBUFFERED=1
      - SSH_TARGET_HOST=attacker
      - SSH_TARGET_PORT=2222
      - SSH_REAL_SERVER=server
      - SSH_USERNAME=victim
      - HTTP_PORT=8000
      - REDIS_TUNNEL_DEST_HOST=redis
      - REDIS_TUNNEL_DEST_PORT=6379
      - SECRET_VALUE=hunter2
      # Ansible scenario: the LocalForward that the user has "already
      # configured" in /root/.ssh/config and that ansible-playbook inherits
      # when it runs a become-task. The attacker connects to
      # client:ANSIBLE_TUNNEL_LOCAL_PORT to inject into the same zlib
      # compression context as the Ansible sudo password.
      - ANSIBLE_TUNNEL_LOCAL_PORT=15432
      - ANSIBLE_TUNNEL_DEST_HOST=redis
      - ANSIBLE_TUNNEL_DEST_PORT=6379
      - SUDO_SECRET_VALUE=hunter2
      # Which browsers the client launches. Default on so the default stack and
      # all verify_*.py work; benchmark.py sets each to 0 when its scenario
      # isn't in scope, so a sweep launches only the browser it needs (saves
      # memory/CPU and avoids the unused browser blocking the needed one).
      - LAUNCH_FIREFOX=${LAUNCH_FIREFOX:-1}
      - LAUNCH_CHROMIUM=${LAUNCH_CHROMIUM:-1}
      # Grant the Chromium 142+ Local Network Access permission (simulate the
      # victim's one-time "Allow"). Default on. Set to 0 to demonstrate that
      # without it, headless Chromium auto-denies and browser_pna is blocked.
      - LNA_GRANT=${LNA_GRANT:-1}
    ports:
      - "8000:8000"
    networks:
      - sshpoc

networks:
  sshpoc:
    driver: bridge
