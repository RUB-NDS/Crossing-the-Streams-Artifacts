name: ssh-compression-poc

services:
  # ----------------------------------------------------------------------
  # Generates SSH host key + client user key on a shared volume.
  # Other services depend on this completing successfully.
  # ----------------------------------------------------------------------
  keygen:
    build:                   # reuse server image (has ssh-keygen)
      context: .
      dockerfile: server/Dockerfile
    container_name: poc-keygen
    volumes:
      - ./keys:/keys
      - ./scripts:/scripts:ro
    command: ["/bin/sh", "/scripts/keygen.sh"]
    networks:
      - sshpoc

  # ----------------------------------------------------------------------
  # Internal Redis server.  The victim's application authenticates to it
  # with AUTH <password> through the SSH tunnel.  Started WITHOUT a
  # password -- the client sets one via CONFIG SET after the tunnel is up.
  # ----------------------------------------------------------------------
  redis:
    image: redis:8-alpine
    container_name: poc-redis
    hostname: redis
    networks:
      - sshpoc

  # ----------------------------------------------------------------------
  # SSH server (the bastion / jump host).  Forces compression, allows
  # TCP/IP port forwarding to redis on the internal network.
  # ----------------------------------------------------------------------
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: poc-server
    hostname: server
    depends_on:
      keygen:
        condition: service_completed_successfully
      redis:
        condition: service_started
    volumes:
      - ./keys:/keys:ro
    networks:
      - sshpoc

  # ----------------------------------------------------------------------
  # Attacker: passive MitM at the TCP layer + scapy packet observer +
  # attack orchestrator.  Sits on the path between client and server.
  # ----------------------------------------------------------------------
  attacker:
    build: ./attacker
    container_name: poc-attacker
    hostname: attacker
    depends_on:
      - server
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      - PYTHONUNBUFFERED=1
      - SERVER_HOST=server
      - SERVER_PORT=22
      - LISTEN_PORT=2222
      - HTTP_PORT=9000
      - CLIENT_CONTROL_URL=http://client:8000
      - CLIENT_HOST=client
      # Local forward ports on the client that the attacker dials into.
      # TUNNEL_PORT is the Redis tunnel used by the direct/BEAST variants;
      # ANSIBLE_TUNNEL_PORT is the LocalForward declared in the client's
      # /root/.ssh/config and used by the Ansible variant.
      - TUNNEL_PORT=6379
      - ANSIBLE_TUNNEL_PORT=15432
    ports:
      - "9000:9000"
    networks:
      - sshpoc

  # ----------------------------------------------------------------------
  # Client (the victim host).  Connects via the attacker's TCP forwarder,
  # sets up a local port forward (Redis on 0.0.0.0), and exposes a small
  # HTTP control API used by the test harness.
  # ----------------------------------------------------------------------
  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: poc-client
    hostname: client
    depends_on:
      keygen:
        condition: service_completed_successfully
      attacker:
        condition: service_started
      redis:
        condition: service_started
    volumes:
      - ./keys:/keys:ro
    environment:
      - PYTHONUNBUFFERED=1
      - SSH_TARGET_HOST=attacker
      - SSH_TARGET_PORT=2222
      - SSH_REAL_SERVER=server
      - SSH_USERNAME=victim
      - HTTP_PORT=8000
      - REDIS_TUNNEL_DEST_HOST=redis
      - REDIS_TUNNEL_DEST_PORT=6379
      - SECRET_VALUE=hunter2
      # Ansible variant: the LocalForward that the user has "already
      # configured" in /root/.ssh/config and that ansible-playbook
      # inherits when it runs a become-task.  The attacker connects to
      # client:ANSIBLE_TUNNEL_LOCAL_PORT to inject into the same zlib
      # compression context as the Ansible sudo password.
      - ANSIBLE_TUNNEL_LOCAL_PORT=15432
      - ANSIBLE_TUNNEL_DEST_HOST=redis
      - ANSIBLE_TUNNEL_DEST_PORT=6379
      - SUDO_SECRET_VALUE=hunter2
    ports:
      - "8000:8000"
    networks:
      - sshpoc

networks:
  sshpoc:
    driver: bridge
