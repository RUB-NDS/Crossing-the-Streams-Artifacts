[defaults]
inventory = /app/ansible/inventory.yml
host_key_checking = True
stdout_callback = minimal
retry_files_enabled = False

[ssh_connection]
# Keep -C (the attack hinges on SSH compression) but disable ControlMaster /
# ControlPersist so every ansible-playbook invocation creates a *fresh* SSH
# connection with a *fresh* zlib compression context. Three properties
# follow at the cost of one SSH handshake per iteration:
#
#   * No flushing. The LZ77 window is empty at the start of each iteration.
#   * Session channel ID is always 0. With multiplexing, consecutive
#     session channels get different server-assigned IDs and the
#     CHANNEL_DATA-header prefix would stop matching.
#   * Simpler lifecycle. The ssh slave dies as soon as the playbook exits.
#
# Pipelining would run module code through ssh's stdin, complicating the
# wire pattern; our task is `raw` anyway, so pipelining wouldn't apply.
ssh_args = -C -o ControlMaster=no -o ControlPersist=no
pipelining = False
