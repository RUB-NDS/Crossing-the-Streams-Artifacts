[defaults]
inventory = /app/ansible/inventory.yml
host_key_checking = True
stdout_callback = minimal
# Do not retry on failure -- one shot per run.
retry_files_enabled = False

[ssh_connection]
# Ansible's default is "-C -o ControlMaster=auto -o ControlPersist=60s".
# We keep -C (the whole attack hinges on SSH compression being on) but
# disable ControlMaster / ControlPersist so that every ansible-playbook
# invocation creates a *fresh* SSH connection with a *fresh* zlib
# compression context.  This buys us three pleasant properties at
# the cost of paying the SSH handshake on every iteration:
#
#   * No flushing.  The LZ77 window is already empty at the start of
#     each iteration, so the attacker doesn't need a 33 KiB flush
#     step to evict the previous guess from the window.
#   * Session channel ID is always 0.  With multiplexing, consecutive
#     session channels get different server-assigned IDs and our
#     CHANNEL_DATA-header prefix stops matching -- here every run has
#     exactly one session, which is always channel 0.
#   * Simpler lifecycle.  The SSH slave that ansible-playbook spawns
#     dies as soon as the playbook exits, so killing the ansible
#     process also frees the LocalForward port binding cleanly.
#
# Pipelining would run module code through ssh's stdin, which
# complicates the wire pattern we're modelling.  Our task is `raw`
# anyway, so pipelining wouldn't apply.
ssh_args = -C -o ControlMaster=no -o ControlPersist=no
pipelining = False
