---
# Minimal Ansible playbook used by the Ansible attack scenario (Section 5.3).
#
# The point of the playbook is not to do anything useful on the server: it
# exists to reproduce the wire behaviour of `become: yes` with sudo --
# writing the sudo password to ssh's stdin, which ends up in a single
# SSH_MSG_CHANNEL_DATA packet on the session channel.
#
# The task uses the `raw` module so the c->s zlib stream contains exactly
# one CHANNEL_REQUEST and one CHANNEL_DATA (the sudo password). This matches
# the wire model the Ansible adapter expects.
#
# `sleep 2` keeps the SSH connection (and therefore the LocalForward
# configured in /root/.ssh/config) alive long enough for the attacker to
# open one direct-tcpip channel through the same zlib compression context
# and inject one guess. The client's /send_secret_ansible handler kills the
# playbook as soon as the next guess is triggered, so this upper bound only
# matters if the attacker stops sending guesses.
- name: Adaptive compression attack on SSH -- one connection per guess
  hosts: ansible-target
  gather_facts: false
  become: true
  become_method: sudo
  tasks:
    - name: keep the SSH tunnel alive for one attacker injection
      ansible.builtin.raw: sleep 2
